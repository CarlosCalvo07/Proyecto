
# ==========================================
# ZERO TRUST - NGINX FRONTEND
# Configuracion inicial HTTP
# ==========================================

server {

    # ======================================
    # CONFIGURACION DEL SERVIDOR
    # ======================================

    # Puerto HTTP
    listen 80;

    # Dominio pendiente de configurar
    server_name _;

    # Ocultar version de Nginx
    server_tokens off;

    # ======================================
    # FRONTEND REACT
    # ======================================

    # Directorio del Frontend compilado
    root /var/www/zero-trust;

    # Archivo principal
    index index.html;

    # Servir aplicacion React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ======================================
    # SECURITY HEADERS
    # ======================================

    # Evitar que la pagina se incruste
    # en marcos de otros sitios
    add_header X-Frame-Options "DENY" always;

    # Evitar interpretacion incorrecta
    # de tipos de contenido
    add_header X-Content-Type-Options "nosniff" always;

    # Controlar informacion del referente
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Politica de seguridad de contenido
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # ======================================
    # REGISTROS DE SEGURIDAD
    # ======================================

    # Registrar solicitudes HTTP
    access_log /var/log/nginx/access.log combined;

    # Registrar errores del servidor
    error_log /var/log/nginx/error.log warn;

    # ======================================
    # PROTECCION DE LA API
    # ======================================

    # Bloquear todas las solicitudes
    # hacia la API mediante HTTP.
    #
    # Login, JWT y Dashboard se habilitaran
    # exclusivamente mediante HTTPS.

    location ^~ /api/ {
        return 403;
    }

    # ======================================
    # BLOQUEAR ARCHIVOS OCULTOS
    # ======================================

    # Evitar acceso a archivos como
    # .env, .git y otras configuraciones

    location ~ /\.(?!well-known/) {
        deny all;
    }

}
