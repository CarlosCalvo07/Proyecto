
# ==========================================
# ZERO TRUST - API REVERSE PROXY
# Comunicacion privada Frontend - Backend
# ==========================================

# IMPORTANTE:
# Este archivo se incluira posteriormente
# dentro del servidor HTTPS de Nginx.

# IP privada provisional del Backend:
# 10.1.1.10
#
# Reemplazar con la IP privada real
# cuando creemos la instancia EC2 Backend.

# ==========================================
# PROXY SEGURO PARA LA API REST
# ==========================================

location ^~ /api/ {

    # Backend Node.js en red privada
    proxy_pass http://10.1.1.10:3000;

    # Protocolo HTTP del proxy
    proxy_http_version 1.1;

    # Conservar el host solicitado
    proxy_set_header Host $host;

    # Identificar la IP observada por Nginx
    proxy_set_header X-Real-IP $remote_addr;

    # No confiar en encabezados enviados
    # directamente por clientes externos
    proxy_set_header X-Forwarded-For $remote_addr;

    # Informar que el acceso publico usa HTTPS
    proxy_set_header X-Forwarded-Proto https;

    # Enviar el encabezado JWT al Backend
    proxy_set_header Authorization $http_authorization;

    # ======================================
    # LIMITES DE SEGURIDAD
    # ======================================

    # Limitar tamaño de solicitudes
    client_max_body_size 10k;

    # Tiempo maximo para conectar
    proxy_connect_timeout 5s;

    # Tiempo maximo de lectura
    proxy_read_timeout 15s;

    # Tiempo maximo de envio
    proxy_send_timeout 15s;

    # Mantener almacenamiento intermedio
    proxy_request_buffering on;

    # ======================================
    # SEGURIDAD ADICIONAL
    # ======================================

    # No modificar redirecciones del Backend
    proxy_redirect off;

}
