
# =====================================
# ZERO TRUST - FAIL2BAN
# Filtro de autenticacion Nginx
# =====================================

[Definition]

# Detectar respuestas de autenticacion fallida
# HTTP 401 = credenciales incorrectas
# HTTP 429 = demasiadas solicitudes

failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /api/auth/login HTTP/[0-9.]+" 401(?:\s|$)
            ^<HOST> - \S+ \[[^\]]+\] "POST /api/auth/login HTTP/[0-9.]+" 429(?:\s|$)

# No ignorar coincidencias adicionales
ignoreregex =
